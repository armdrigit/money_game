<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>한국 지폐 학습 게임</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="지폐학습">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dff7ff">
<style>
:root{
  --bg1:#fff7d7;--bg2:#dff7ff;--card:#ffffffee;--blue:#4b8dff;--green:#4fc878;
  --pink:#ff77a3;--orange:#ffbd56;--text:#243044;--good:#109b55;--bad:#d94b4b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);
  user-select:none;touch-action:manipulation;overflow-x:hidden;
}
.app{max-width:1120px;margin:0 auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.title{font-size:clamp(24px,4vw,44px);font-weight:1000;letter-spacing:-.04em}
.status{background:white;border:3px solid #b9dcff;border-radius:999px;padding:8px 14px;font-weight:900}
.panel{background:var(--card);border:4px solid #d7ecff;border-radius:28px;padding:18px;box-shadow:0 10px 30px #78a5c730;min-height:78vh}
.hidden{display:none!important}
.instruction{
  margin:14px 0;background:#fff7cc;border:4px solid #ffd86e;border-radius:24px;
  padding:16px;text-align:center;font-size:clamp(28px,5vw,56px);font-weight:1000;line-height:1.12;
}
.moneyTextBox{
  display:inline-block;background:white;border:6px solid #79b7ff;border-radius:26px;
  padding:18px 44px;min-width:270px;box-shadow:0 8px 0 #d7ecff;
}
.btn{
  border:0;border-radius:22px;padding:16px 18px;font-size:clamp(18px,2.3vw,26px);
  font-weight:1000;background:var(--blue);color:white;box-shadow:0 6px 0 #2e66c8;cursor:pointer;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e66c8}
.btn.green{background:var(--green);box-shadow:0 6px 0 #2b9950}
.btn.orange{background:var(--orange);box-shadow:0 6px 0 #d48b22;color:#382700}
.btn.pink{background:var(--pink);box-shadow:0 6px 0 #c7476f}
.smallBtn{font-size:18px;padding:10px 14px;border-radius:16px}
.homeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.unitHead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.unitTitle{font-size:clamp(24px,3vw,38px);font-weight:1000}
.progress{font-size:20px;font-weight:900;color:#48617e}
.dropArea{
  min-height:220px;border:6px dashed #86b7ff;border-radius:30px;background:#f7fcff;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:18px;margin:12px 0;position:relative;
}
.dropArea.active{background:#e7f7ff;border-color:#4b8dff}
.dropLabel{position:absolute;top:10px;left:18px;font-size:22px;font-weight:1000;color:#4772a4}
.bankPool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-top:14px}
.bank,.targetCard{
  width:min(31vw,210px);background:white;border:4px solid #dbe8f7;border-radius:18px;padding:8px;
  box-shadow:0 8px 18px #5b84a02a;cursor:grab;touch-action:none;
}
.bank:active{cursor:grabbing;transform:scale(.98)}
.bank img,.targetCard img{display:block;width:100%;height:auto;border-radius:10px;pointer-events:none}
.tiny{width:min(25vw,170px)}
.bank.used{opacity:.35;filter:grayscale(.2);pointer-events:none}
.dragging{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);opacity:.95;width:min(31vw,210px)}
.sumBox{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sumChip{background:white;border:4px solid #d6e8ff;border-radius:18px;padding:10px 16px;font-size:24px;font-weight:1000}
.feedback{min-height:64px;text-align:center;font-size:clamp(28px,4vw,46px);font-weight:1000;margin-top:10px}
.good{color:var(--good)}.bad{color:var(--bad)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5000}
.confetti span{position:absolute;font-size:34px;animation:fall 1.1s ease-out forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(480deg);opacity:0}}
@media(max-width:760px){
  .homeGrid{grid-template-columns:1fr}
  .panel{border-radius:20px;padding:12px}
  .dropArea{min-height:175px}
  .bank,.targetCard{width:42vw}
  .tiny{width:36vw}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">💵 한국 지폐 학습 게임</div>
    <div class="status" id="soundStatus">소리 준비</div>
  </div>
  <div class="panel">
    <section id="home">
      <div class="instruction">시작할 단원을 골라요</div>
      <button class="btn green" id="bgmBtn">▶ 배경음악 켜기</button>
      <button class="btn orange" id="audioReadyBtn" style="margin-top:10px">🔊 음성 준비하기</button>
      <div class="homeGrid" id="unitButtons" style="margin-top:14px"></div>
      <div class="sumChip" style="margin-top:14px">iPad에서는 먼저 ‘음성 준비하기’를 한 번 눌러 주세요. 홈 화면에 추가하면 앱처럼 크게 실행됩니다.</div>
    </section>

    <section id="game" class="hidden">
      <div class="unitHead">
        <div>
          <div class="unitTitle" id="unitTitle"></div>
          <div class="progress" id="progress"></div>
        </div>
        <div>
          <button class="btn smallBtn orange" id="homeBtn">처음으로</button>
          <button class="btn smallBtn pink" id="nextBtn">다음 문제</button>
        </div>
      </div>
      <div class="instruction" id="instruction"></div>
      <div class="sumBox" id="sumBox"></div>
      <div class="dropArea" id="dropArea"><div class="dropLabel">여기에 올려요</div></div>
      <div class="bankPool" id="bankPool"></div>
      <div class="feedback" id="feedback"></div>
    </section>
  </div>
</div>
<div class="confetti" id="confetti"></div>
<audio id="bgm" src="sori.m4a" loop preload="auto" playsinline></audio>

<script>
const DENOMS=[1000,5000,10000,50000];
const moneyName={1000:"1,000원",5000:"5,000원",10000:"10,000원",50000:"50,000원"};
const unitNames={
  1:"같은 지폐 찾기",2:"지폐 이름 찾기",3:"천 원으로 금액 만들기",4:"오천 원으로 금액 만들기",
  5:"만 원으로 금액 만들기",6:"오만 원으로 금액 만들기",7:"천 원·오천 원으로 만들기",
  8:"만 원·오만 원으로 만들기",9:"여러 지폐로 만들기"
};
const $=id=>document.getElementById(id);
const bgm=$("bgm"), home=$("home"), game=$("game"), dropArea=$("dropArea"), pool=$("bankPool");

let audioCtx=null, masterGain=null, wakeLock=null, bgmOn=false;
let voiceBuffers={}, voicesLoading=false, voicesReady=false;
let currentUnit=1,currentGame=1,currentProblem=null,selectedSum=0,drag=null,isAdvancing=false;
let transitionToken=0;
let transitionTimers=[];

function formatWon(n){return n.toLocaleString("ko-KR")+"원"}
function imgCandidates(v){return [`${v}.png`,`${v}.jpg`,`${v}.jpeg`,`${v}.webp`]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function choice(a){return a[Math.floor(Math.random()*a.length)]}

function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      audioCtx=new AC();
      masterGain=audioCtx.createGain();
      masterGain.gain.value=1;
      masterGain.connect(audioCtx.destination);
    }
  }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume().catch(()=>{});
  keepScreenOn();
}

async function keepScreenOn(){
  try{
    if("wakeLock" in navigator && !wakeLock){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>wakeLock=null);
    }
  }catch(e){}
}

async function prepareVoices(){
  ensureAudio();
  if(!audioCtx){$("soundStatus").textContent="음성 준비 실패";return;}
  if(voicesReady){$("soundStatus").textContent="음성 준비 완료";return;}
  if(voicesLoading)return;
  voicesLoading=true;
  $("soundStatus").textContent="음성 준비 중...";
  for(const v of DENOMS){
    try{
      const res=await fetch(`${v}.mp3?cache=${Date.now()}`, {cache:"reload"});
      const arr=await res.arrayBuffer();
      voiceBuffers[v]=await audioCtx.decodeAudioData(arr);
    }catch(e){
      console.log("voice load fail",v,e);
    }
  }
  voicesReady=DENOMS.every(v=>voiceBuffers[v]);
  voicesLoading=false;
  $("soundStatus").textContent=voicesReady ? "음성 준비 완료" : "일부 음성 파일 확인 필요";
}

async function toggleBgm(){
  ensureAudio();
  if(bgmOn){
    bgm.pause(); bgmOn=false; $("bgmBtn").textContent="▶ 배경음악 켜기"; $("soundStatus").textContent="배경음악 꺼짐";
  }else{
    try{
      bgm.volume=.35;
      await bgm.play();
      bgmOn=true;
      $("bgmBtn").textContent="⏸ 배경음악 끄기";
      $("soundStatus").textContent=voicesReady ? "배경음악 켜짐 / 음성 준비 완료" : "배경음악 켜짐";
    }catch(e){
      $("soundStatus").textContent="배경음악 파일 확인 필요";
    }
  }
}

function duck(ms=700){
  if(!bgmOn)return;
  try{bgm.volume=.13; setTimeout(()=>{if(bgmOn)bgm.volume=.35},ms)}catch(e){}
}

function playBuffer(buffer, volume=1, onended=null){
  ensureAudio();
  if(!audioCtx||!buffer){if(onended)setTimeout(onended,500);return;}
  const src=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();
  gain.gain.value=volume;
  src.buffer=buffer;
  src.connect(gain).connect(masterGain || audioCtx.destination);
  src.onended=()=>{ if(onended)onended(); };
  src.start(0);
}

function tone(freq,start,dur,type="sine",gain=.14){
  ensureAudio(); if(!audioCtx)return;
  const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,now+start);
  g.gain.setValueAtTime(.0001,now+start);
  g.gain.exponentialRampToValueAtTime(gain,now+start+.015);
  g.gain.exponentialRampToValueAtTime(.0001,now+start+dur);
  o.connect(g).connect(masterGain || audioCtx.destination);
  o.start(now+start);o.stop(now+start+dur+.02);
}
function sfxDrop(){duck(200);tone(760,0,.08,"triangle",.11);tone(980,.055,.08,"triangle",.09)}
function sfxGood(){duck(500);tone(523,0,.12);tone(659,.11,.12);tone(784,.22,.16)}
function sfxBad(){
  ensureAudio();duck(400);if(!audioCtx)return;
  const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type="square";o.frequency.setValueAtTime(220,now);o.frequency.linearRampToValueAtTime(130,now+.3);
  g.gain.setValueAtTime(.15,now);g.gain.exponentialRampToValueAtTime(.0001,now+.32);
  o.connect(g).connect(masterGain || audioCtx.destination);o.start(now);o.stop(now+.34);
}
function sfxCelebrate(){
  duck(1150);
  [523,659,784,1046,784,1046].forEach((f,i)=>tone(f,i*.09,.11,"triangle",.13));
  setTimeout(()=>{tone(880,0,.09,"square",.06);tone(1175,.06,.12,"square",.06)},560);
}

function playMoneyVoice(value,onDone){
  ensureAudio(); duck(1800);
  let done=false;
  const finish=()=>{ if(done)return; done=true; if(onDone)onDone(); };
  const buffer=voiceBuffers[value];
  if(buffer){
    playBuffer(buffer,1,finish);
    // iPad에서 onended가 누락될 때만 사용
    setTimeout(finish, Math.max(900, buffer.duration*1000+500));
  }else{
    // 음성 준비 전이라면 마지막 예비 방식: 바로 새 Audio 재생
    const a=new Audio(`${value}.mp3?x=${Date.now()}`);
    a.playsInline=true; a.volume=1;
    a.onended=finish; a.onerror=()=>setTimeout(finish,700);
    a.play().catch(()=>setTimeout(finish,900));
    setTimeout(finish,2800);
  }
}


function clearTransitionTimers(){
  transitionTimers.forEach(t=>clearTimeout(t));
  transitionTimers=[];
}
function scheduleTransition(fn, ms, token){
  const t=setTimeout(()=>{
    if(token!==transitionToken) return;
    fn();
  }, ms);
  transitionTimers.push(t);
  return t;
}
function beginAnswerLock(){
  transitionToken++;
  clearTransitionTimers();
  isAdvancing=true;
  return transitionToken;
}
function endAnswerLockAndNext(token){
  if(token!==transitionToken) return;
  clearTransitionTimers();
  isAdvancing=false;
  nextProblem();
}

function confetti(){
  const c=$("confetti");c.innerHTML="";
  const icons=["⭐","💛","🎉","👏","🌈"];
  for(let i=0;i<26;i++){
    const s=document.createElement("span");s.textContent=choice(icons);s.style.left=Math.random()*100+"%";s.style.animationDelay=Math.random()*.25+"s";c.appendChild(s);
  }
  setTimeout(()=>c.innerHTML="",1300);
}
function setFeedback(msg, cls){$("feedback").className="feedback "+cls;$("feedback").textContent=msg}

function completeWithVoice(value){
  if(isAdvancing)return;
  const token=beginAnswerLock();

  setFeedback("맞았어요!","good");
  sfxGood();
  scheduleTransition(sfxCelebrate,330,token);
  confetti();

  // 정답 화면을 유지한 채, 효과음이 끝난 뒤 금액 음성을 재생합니다.
  scheduleTransition(()=>{
    playMoneyVoice(value,()=>{
      scheduleTransition(()=>endAnswerLockAndNext(token),650,token);
    });
  },1050,token);

  // iPad에서 ended 이벤트가 누락될 때만 쓰는 단일 예비 장치입니다.
  scheduleTransition(()=>endAnswerLockAndNext(token),6200,token);
}

function completeNoVoice(msg="목표 금액을 만들었어요!"){
  if(isAdvancing)return;
  const token=beginAnswerLock();
  setFeedback(msg,"good");
  sfxGood();
  scheduleTransition(sfxCelebrate,330,token);
  confetti();
  scheduleTransition(()=>endAnswerLockAndNext(token),2100,token);
}
function wrong(msg="다시 해 보세요."){
  setFeedback(msg,"bad");sfxBad();
}

function createImg(value){
  const img=document.createElement("img");let tries=imgCandidates(value),idx=0;
  img.alt=moneyName[value];img.src=tries[idx];
  img.onerror=()=>{idx++; if(idx<tries.length) img.src=tries[idx]; else img.style.display="none"};
  return img;
}
function makeBank(value,tiny=false){
  const el=document.createElement("div");el.className="bank"+(tiny?" tiny":"");el.dataset.value=value;
  el.appendChild(createImg(value));el.addEventListener("pointerdown",startDrag);return el;
}
function placedBank(value){
  const el=makeBank(value,true);el.style.pointerEvents="none";return el;
}
function clearGame(){
  clearTransitionTimers();
  dropArea.innerHTML='<div class="dropLabel">여기에 올려요</div>';
  pool.innerHTML="";$("sumBox").innerHTML="";$("feedback").textContent="";
  selectedSum=0;isAdvancing=false;
}

function makeButtons(){
  const box=$("unitButtons");
  for(let i=1;i<=9;i++){
    const b=document.createElement("button");b.className="btn";b.textContent=`${i}단원 ${unitNames[i]}`;
    b.onclick=()=>startUnit(i);box.appendChild(b);
  }
}
makeButtons();

$("bgmBtn").onclick=toggleBgm;
$("audioReadyBtn").onclick=prepareVoices;
$("homeBtn").onclick=()=>{ensureAudio();game.classList.add("hidden");home.classList.remove("hidden")};
$("nextBtn").onclick=()=>{ensureAudio(); if(!isAdvancing) nextProblem()};

function startUnit(n){
  ensureAudio();
  if(!voicesReady && !voicesLoading) prepareVoices(); // 배경음악은 건드리지 않음
  currentUnit=n;currentGame=1;home.classList.add("hidden");game.classList.remove("hidden");
  $("unitTitle").textContent=`${n}단원 ${unitNames[n]}`;
  nextProblem(true);
}
function nextProblem(reset=false){
  ensureAudio();
  if(!reset)currentGame++;
  if(currentGame>5)currentGame=1;
  $("progress").textContent=`문제 ${currentGame} / 5`;
  clearGame();
  if(currentUnit===1) setupSame();
  else if(currentUnit===2) setupName();
  else setupSum(currentUnit);
}

function setupSame(){
  const target=choice(DENOMS);currentProblem={type:"match",target};
  $("instruction").innerHTML="위와 같은 지폐를 찾아 올려요";
  const card=document.createElement("div");card.className="targetCard";card.appendChild(createImg(target));dropArea.appendChild(card);
  shuffle(DENOMS).forEach(v=>pool.appendChild(makeBank(v)));
}
function setupName(){
  const target=choice(DENOMS);currentProblem={type:"name",target};
  $("instruction").innerHTML=`<span class="moneyTextBox">${moneyName[target]}</span>`;
  dropArea.querySelector(".dropLabel").textContent="같은 금액 지폐를 올려요";
  shuffle(DENOMS).forEach(v=>pool.appendChild(makeBank(v)));
}
function setupSum(unit){
  let allowed,max,label="지폐를 눌러 담아요";
  if(unit===3){allowed=[1000];max=10000}
  if(unit===4){allowed=[5000];max=50000}
  if(unit===5){allowed=[10000];max=100000}
  if(unit===6){allowed=[50000];max=500000}
  if(unit===7){allowed=[1000,5000];max=30000;label="여러 지폐를 담아요"}
  if(unit===8){allowed=[10000,50000];max=300000;label="여러 지폐를 담아요"}
  if(unit===9){allowed=[1000,5000,10000,50000];max=200000;label="여러 지폐를 담아요"}
  const target=makeReachableTarget(allowed,max,10);
  currentProblem={type:"sum",target,allowed};
  $("instruction").innerHTML=`<span class="moneyTextBox">${formatWon(target)}</span>`;
  dropArea.querySelector(".dropLabel").textContent=label;
  updateSum();
  makePool(allowed,target,10).forEach(v=>pool.appendChild(makeBank(v,true)));
}
function makeReachableTarget(allowed,max,maxCount){
  const vals=[];
  function rec(sum,count){
    if(count>maxCount||sum>max)return;
    if(sum>0)vals.push(sum);
    for(const v of allowed)rec(sum+v,count+1);
  }
  rec(0,0);
  return choice([...new Set(vals)]);
}
function makePool(allowed,target,total){
  let ans=null;
  function dfs(sum,arr){
    if(sum===target){ans=arr;return true}
    if(sum>target||arr.length>=total)return false;
    for(const v of shuffle(allowed)){if(dfs(sum+v,arr.concat(v)))return true}
    return false;
  }
  dfs(0,[]);
  const list=ans?[...ans]:[];
  while(list.length<total)list.push(choice(allowed));
  return shuffle(list);
}
function updateSum(){
  $("sumBox").innerHTML=`<div class="sumChip">담은 돈: ${formatWon(selectedSum)}</div><div class="sumChip">목표: ${formatWon(currentProblem.target)}</div>`;
}

function startDrag(e){
  ensureAudio();
  if(isAdvancing)return;
  const src=e.currentTarget;if(src.classList.contains("used"))return;
  const clone=src.cloneNode(true);clone.classList.add("dragging");document.body.appendChild(clone);
  drag={src,clone,value:Number(src.dataset.value)};moveDrag(e);
  document.addEventListener("pointermove",moveDrag);
  document.addEventListener("pointerup",endDrag,{once:true});
}
function moveDrag(e){
  if(!drag)return;
  drag.clone.style.left=e.clientX+"px";drag.clone.style.top=e.clientY+"px";
  const r=dropArea.getBoundingClientRect();
  dropArea.classList.toggle("active",e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);
}
function endDrag(e){
  document.removeEventListener("pointermove",moveDrag);
  if(!drag)return;
  const {src,clone,value}=drag;clone.remove();
  const r=dropArea.getBoundingClientRect();
  const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  dropArea.classList.remove("active");
  if(inside) handleDrop(src,value);
  drag=null;
}
function handleDrop(src,value){
  ensureAudio();
  if(isAdvancing)return;
  if(currentProblem.type==="match"||currentProblem.type==="name"){
    if(value===currentProblem.target){
      dropArea.appendChild(placedBank(value));
      completeWithVoice(value);
    }else wrong();
    return;
  }
  if(currentProblem.type==="sum"){
    if(selectedSum+value>currentProblem.target){wrong("너무 많아요. 다른 지폐를 골라요.");return}
    selectedSum+=value;sfxDrop();src.classList.add("used");dropArea.appendChild(placedBank(value));updateSum();
    if(selectedSum===currentProblem.target)completeNoVoice();
  }
}
pool.addEventListener("click",e=>{
  const card=e.target.closest(".bank");
  if(!card||card.classList.contains("used")||drag||isAdvancing)return;
  if(currentProblem&&currentProblem.type==="sum")handleDrop(card,Number(card.dataset.value));
});
