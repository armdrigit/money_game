<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>한국 지폐 터치 학습 게임</title>
<style>
:root{--bg1:#fff7dc;--bg2:#dff7ff;--card:#ffffffee;--blue:#4b8dff;--pink:#ff75a0;--green:#52c878;--orange:#ffb84d;--text:#243044;--good:#13a85b;--bad:#e05555}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);touch-action:manipulation;user-select:none;overflow-x:hidden}.app{max-width:1100px;margin:0 auto;padding:14px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}.title{font-size:clamp(22px,3.8vw,42px);font-weight:900;letter-spacing:-.04em}.pill{background:white;border:3px solid #b8dcff;border-radius:999px;padding:8px 14px;font-weight:800}.panel{background:var(--card);border:4px solid #d7ecff;border-radius:28px;padding:18px;box-shadow:0 10px 30px #78a5c730;min-height:78vh}.home{display:grid;gap:14px}.homeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btn{border:0;border-radius:22px;padding:16px 18px;font-size:clamp(18px,2.4vw,26px);font-weight:900;background:var(--blue);color:white;box-shadow:0 6px 0 #2e66c8;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e66c8}.btn.orange{background:var(--orange);box-shadow:0 6px 0 #d48b22;color:#352500}.btn.green{background:var(--green);box-shadow:0 6px 0 #2b9950}.btn.pink{background:var(--pink);box-shadow:0 6px 0 #c7476f}.smallBtn{font-size:18px;padding:10px 14px;border-radius:16px}.unitHead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.unitTitle{font-size:clamp(24px,3vw,38px);font-weight:900}.progress{font-size:20px;font-weight:900;color:#48617e}.instruction{margin:14px 0;background:#fff7cc;border:4px solid #ffd86e;border-radius:24px;padding:16px;text-align:center;font-size:clamp(26px,5vw,54px);font-weight:1000;line-height:1.1}.moneyTextBox{display:inline-block;min-width:260px;background:white;border:6px solid #79b7ff;border-radius:26px;padding:18px 40px;box-shadow:0 8px 0 #d7ecff}.dropArea{min-height:210px;border:6px dashed #86b7ff;border-radius:30px;background:#f7fcff;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:16px;margin:12px 0;position:relative}.dropArea.active{background:#e7f7ff;border-color:#4b8dff}.dropLabel{position:absolute;top:10px;left:18px;font-size:22px;font-weight:900;color:#4772a4}.bankPool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-top:14px}.bank,.choiceCard{width:min(31vw,210px);background:white;border:4px solid #dbe8f7;border-radius:18px;padding:8px;box-shadow:0 8px 18px #5b84a02a;cursor:grab;touch-action:none;position:relative}.bank:active,.choiceCard:active{cursor:grabbing;transform:scale(.98)}.bank img,.choiceCard img{display:block;width:100%;height:auto;border-radius:10px;pointer-events:none}.tiny{width:min(25vw,170px)}.bank.ghost{opacity:.35;filter:grayscale(.25)}.dragging{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);opacity:.95;width:min(31vw,210px)}.sumBox{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}.sumChip{background:white;border:4px solid #d6e8ff;border-radius:18px;padding:10px 16px;font-size:24px;font-weight:900}.feedback{min-height:64px;text-align:center;font-size:clamp(26px,4vw,44px);font-weight:1000;margin-top:10px}.good{color:var(--good)}.bad{color:var(--bad)}.confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:5000}.confetti span{position:absolute;font-size:34px;animation:fall 1.1s ease-out forwards}@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(480deg);opacity:0}}.hidden{display:none!important}@media(max-width:760px){.homeGrid{grid-template-columns:1fr}.panel{border-radius:20px;padding:12px}.dropArea{min-height:170px}.bank,.choiceCard{width:42vw}.tiny{width:36vw}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="app"><div class="top"><div class="title">💵 한국 지폐 학습 게임</div><div class="pill" id="soundStatus">소리 준비</div></div><div class="panel"><section id="home" class="home"><div class="instruction">시작할 단원을 골라요</div><button class="btn green" id="musicToggleBtn">▶ 배경음악 켜기</button><div class="homeGrid" id="unitButtons"></div><div class="sumChip">iPad에서는 먼저 배경음악 버튼을 한 번 눌러 주세요. 같은 폴더에 index.html, 지폐 이미지, mp3 음성, sori.m4a를 올려 주세요.</div></section><section id="game" class="hidden"><div class="unitHead"><div><div class="unitTitle" id="unitTitle"></div><div class="progress" id="progress"></div></div><div><button class="btn smallBtn orange" id="homeBtn">처음으로</button><button class="btn smallBtn pink" id="nextBtn">다음 문제</button></div></div><div class="instruction" id="instruction"></div><div class="sumBox" id="sumBox"></div><div class="dropArea" id="dropArea"><div class="dropLabel" id="dropLabel">여기에 올려요</div></div><div class="bankPool" id="bankPool"></div><div class="feedback" id="feedback"></div></section></div></div><div class="confetti" id="confetti"></div>
<audio id="fallbackAudio" preload="auto" playsinline></audio>
<script>
const DENOMS=[1000,5000,10000,50000];
const moneyName={1000:"1,000원",5000:"5,000원",10000:"10,000원",50000:"50,000원"};
const unitNames={1:"같은 지폐 찾기",2:"지폐 이름 찾기",3:"천 원으로 금액 만들기",4:"오천 원으로 금액 만들기",5:"만 원으로 금액 만들기",6:"오만 원으로 금액 만들기",7:"천 원·오천 원으로 만들기",8:"만 원·오만 원으로 만들기",9:"여러 지폐로 만들기"};
const $=id=>document.getElementById(id);const home=$("home"),game=$("game"),dropArea=$("dropArea"),pool=$("bankPool");
let currentUnit=1,currentGame=1,currentProblem=null,selectedSum=0,pointerDrag=null;

// iPad Chrome/Safari에서 효과음과 mp3가 배경음악에 묻히거나 막히지 않도록 Web Audio로 모두 재생합니다.
const Sound={ctx:null,buffers:{},bgmSource:null,bgmOn:false,ready:false,loading:false,
  files:{bgm:["sori.m4a","sori.mp3"],1000:["1000.mp3","21000.mp3"],5000:["5000.mp3"],10000:["10000.mp3"],50000:["50000.mp3"]},
  async init(){
    if(this.ready||this.loading) return; this.loading=true;
    const C=window.AudioContext||window.webkitAudioContext; if(C) this.ctx=new C();
    if(this.ctx && this.ctx.state==="suspended") await this.ctx.resume().catch(()=>{});
    await Promise.all(Object.entries(this.files).map(async([key,urls])=>{this.buffers[key]=await this.loadFirst(urls)}));
    this.ready=true; this.loading=false; $("soundStatus").textContent="효과음 준비 완료";
  },
  async loadFirst(urls){
    if(!this.ctx) return null;
    for(const url of urls){
      try{const r=await fetch(url,{cache:"reload"}); if(!r.ok) continue; const ab=await r.arrayBuffer(); return await this.ctx.decodeAudioData(ab.slice(0));}catch(e){}
    }
    return null;
  },
  async ensure(){if(!this.ctx||!this.ready) await this.init(); if(this.ctx&&this.ctx.state==="suspended") await this.ctx.resume().catch(()=>{});},
  playBuffer(key,vol=1){
    if(!this.ctx||!this.buffers[key]){this.fallback(key);return;}
    const s=this.ctx.createBufferSource(),g=this.ctx.createGain(); s.buffer=this.buffers[key]; g.gain.value=vol; s.connect(g).connect(this.ctx.destination); s.start(0);
  },
  fallback(key){
    const map={1000:"1000.mp3",5000:"5000.mp3",10000:"10000.mp3",50000:"50000.mp3",bgm:"sori.m4a"}; const a=$("fallbackAudio"); if(!map[key]) return; a.src=map[key]; a.currentTime=0; a.play().catch(()=>{});
  },
  toggleBgm:async function(){
    await this.ensure();
    if(this.bgmOn){this.stopBgm();return;}
    const buf=this.buffers.bgm; if(!this.ctx||!buf){$("soundStatus").textContent="배경음악 파일 확인 필요";return;}
    const s=this.ctx.createBufferSource(),g=this.ctx.createGain(); s.buffer=buf; s.loop=true; g.gain.value=.28; s.connect(g).connect(this.ctx.destination); s.start(0); this.bgmSource=s; this.bgmOn=true;
    $("musicToggleBtn").textContent="⏸ 배경음악 끄기"; $("soundStatus").textContent="배경음악 재생 중";
  },
  stopBgm(){try{this.bgmSource&&this.bgmSource.stop()}catch(e){} this.bgmSource=null; this.bgmOn=false; $("musicToggleBtn").textContent="▶ 배경음악 켜기"; $("soundStatus").textContent="배경음악 꺼짐";},
  good(){this.tone([523,659,784],"sine")},
  bad(){this.tone([220,150],"square")},
  tone(freqs,type){
    if(!this.ctx) return; const now=this.ctx.currentTime;
    freqs.forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type; o.frequency.value=f; const t=now+i*.13; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.17); o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+.2);});
  }
};

async function unlockSound(){await Sound.ensure()}
document.addEventListener("pointerdown",()=>{Sound.ensure()}, {once:false, passive:true});
$("musicToggleBtn").onclick=()=>Sound.toggleBgm();

function formatWon(n){return n.toLocaleString("ko-KR")+"원"}
function imgCandidates(v){return [`${v}.png`,`${v}.jpg`,`${v}.jpeg`,`${v}.webp`]}
function createImg(v){const img=document.createElement("img");let t=imgCandidates(v),i=0;img.alt=moneyName[v];img.src=t[i];img.onerror=()=>{i++;if(i<t.length)img.src=t[i];else{img.onerror=null;img.style.display="none"}};return img}
function shuffled(a){return[...a].sort(()=>Math.random()-.5)}function randomChoice(a){return a[Math.floor(Math.random()*a.length)]}
function confetti(){const c=$("confetti");c.innerHTML="";const icons=["⭐","💛","🎉","👏","🌈"];for(let i=0;i<24;i++){const s=document.createElement("span");s.textContent=icons[Math.floor(Math.random()*icons.length)];s.style.left=Math.random()*100+"%";s.style.animationDelay=Math.random()*.25+"s";c.appendChild(s)}setTimeout(()=>c.innerHTML="",1300)}
function good(msg,v=null,autoNext=true){$("feedback").className="feedback good";$("feedback").textContent=msg||"참 잘했어요!";Sound.good();confetti();if(v)setTimeout(()=>Sound.playBuffer(v,.95),180);if(autoNext)setTimeout(nextProblem,1900)}
function bad(msg){$("feedback").className="feedback bad";$("feedback").textContent=msg||"다시 해 보세요.";Sound.bad()}
function makeBank(v,opt={}){const el=document.createElement("div");el.className="bank"+(opt.tiny?" tiny":"");el.dataset.value=v;el.dataset.id=opt.id||Math.random().toString(36).slice(2);el.appendChild(createImg(v));el.addEventListener("pointerdown",startDrag);return el}
function clearGame(){dropArea.innerHTML='<div class="dropLabel" id="dropLabel">여기에 올려요</div>';pool.innerHTML="";$("sumBox").innerHTML="";$("feedback").textContent="";selectedSum=0}
function makeUnitButtons(){const box=$("unitButtons");for(let i=1;i<=9;i++){const b=document.createElement("button");b.className="btn";b.textContent=`${i}단원 ${unitNames[i]}`;b.onclick=()=>startUnit(i);box.appendChild(b)}}makeUnitButtons();
$("homeBtn").onclick=()=>{game.classList.add("hidden");home.classList.remove("hidden")};$("nextBtn").onclick=nextProblem;
async function startUnit(n){currentUnit=n;currentGame=1;await unlockSound();home.classList.add("hidden");game.classList.remove("hidden");$("unitTitle").textContent=`${n}단원 ${unitNames[n]}`;nextProblem(true)}
function nextProblem(reset=false){if(!reset)currentGame++;if(currentGame>5)currentGame=1;$("progress").textContent=`문제 ${currentGame} / 5`;clearGame();if(currentUnit===1)setupSameBill();else if(currentUnit===2)setupNameFind();else setupMakeMoney(currentUnit)}
function setupSameBill(){const target=randomChoice(DENOMS);currentProblem={type:"match",target};$("instruction").innerHTML="위와 같은 지폐를 찾아 올려요";const targetCard=document.createElement("div");targetCard.className="choiceCard";targetCard.appendChild(createImg(target));dropArea.appendChild(targetCard);shuffled(DENOMS).forEach(v=>pool.appendChild(makeBank(v)))}
function setupNameFind(){const target=randomChoice(DENOMS);currentProblem={type:"name",target};$("instruction").innerHTML=`<span class="moneyTextBox">${moneyName[target]}</span>`;dropArea.querySelector(".dropLabel").textContent="같은 금액 지폐를 올려요";shuffled(DENOMS).forEach(v=>pool.appendChild(makeBank(v)))}
function setupMakeMoney(unit){let allowed,max,label;if(unit===3){allowed=[1000];max=10000;label="천 원 지폐를 눌러 담아요"}if(unit===4){allowed=[5000];max=50000;label="오천 원 지폐를 눌러 담아요"}if(unit===5){allowed=[10000];max=100000;label="만 원 지폐를 눌러 담아요"}if(unit===6){allowed=[50000];max=500000;label="오만 원 지폐를 눌러 담아요"}if(unit===7){allowed=[1000,5000];max=30000;label="천 원·오천 원 지폐를 눌러 담아요"}if(unit===8){allowed=[10000,50000];max=300000;label="만 원·오만 원 지폐를 눌러 담아요"}if(unit===9){allowed=[1000,5000,10000,50000];max=200000;label="여러 지폐를 눌러 담아요"}let target=makeReachableTarget(allowed,max,10);currentProblem={type:"sum",target,allowed};$("instruction").innerHTML=`<span class="moneyTextBox">${formatWon(target)}</span>`;dropArea.querySelector(".dropLabel").textContent=label;updateSum();makePoolForTarget(allowed,target,10).forEach((v,i)=>pool.appendChild(makeBank(v,{id:`p${i}`,tiny:true})))}
function makeReachableTarget(allowed,max,maxCount){const reachable=[];function rec(sum,count){if(count>maxCount||sum>max)return;if(sum>0)reachable.push(sum);for(const v of allowed)rec(sum+v,count+1)}rec(0,0);return randomChoice([...new Set(reachable)].filter(v=>v<=max))}
function makePoolForTarget(allowed,target,total){let best=null;function dfs(sum,arr){if(sum===target){best=arr;return true}if(sum>target||arr.length>=total)return false;for(const v of shuffled(allowed)){if(dfs(sum+v,arr.concat(v)))return true}return false}dfs(0,[]);let list=best?[...best]:[];while(list.length<total)list.push(randomChoice(allowed));return shuffled(list)}
function updateSum(){$("sumBox").innerHTML=`<div class="sumChip">담은 돈: ${formatWon(selectedSum)}</div><div class="sumChip">목표: ${formatWon(currentProblem.target)}</div>`}
function startDrag(e){if(e.button!==undefined&&e.button!==0)return;unlockSound();const src=e.currentTarget;if(src.classList.contains("ghost"))return;src.setPointerCapture?.(e.pointerId);const clone=src.cloneNode(true);clone.classList.add("dragging");document.body.appendChild(clone);pointerDrag={src,clone,value:Number(src.dataset.value),pointerId:e.pointerId};moveDrag(e);document.addEventListener("pointermove",moveDrag);document.addEventListener("pointerup",endDrag,{once:true})}
function moveDrag(e){if(!pointerDrag)return;pointerDrag.clone.style.left=e.clientX+"px";pointerDrag.clone.style.top=e.clientY+"px";const r=dropArea.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;dropArea.classList.toggle("active",inside)}
function endDrag(e){document.removeEventListener("pointermove",moveDrag);if(!pointerDrag)return;const{src,clone,value}=pointerDrag;clone.remove();const r=dropArea.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;dropArea.classList.remove("active");if(inside)handleDrop(src,value);pointerDrag=null}
function handleDrop(src,value){if(currentProblem.type==="match"||currentProblem.type==="name"){if(value===currentProblem.target){const placed=makeBank(value,{tiny:true});placed.style.pointerEvents="none";dropArea.appendChild(placed);good("맞았어요!",value,true)}else bad("다시 해 보세요.");return}if(currentProblem.type==="sum"){if(selectedSum+value>currentProblem.target){bad("너무 많아요. 다른 지폐를 골라요.");return}selectedSum+=value;src.classList.add("ghost");src.style.pointerEvents="none";const placed=makeBank(value,{tiny:true});placed.style.pointerEvents="none";dropArea.appendChild(placed);updateSum();if(selectedSum===currentProblem.target)good("목표 금액을 만들었어요!",null,true)}}
pool.addEventListener("click",e=>{const card=e.target.closest(".bank");if(!card||card.classList.contains("ghost")||pointerDrag)return;if(currentProblem&&currentProblem.type==="sum")handleDrop(card,Number(card.dataset.value))});
</script>
</body>
</html>
